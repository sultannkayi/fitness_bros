services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fitnessbros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strongpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitnessbros"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn main.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      - DEBUG=0
      - DATABASE_URL=postgres://postgres:strongpassword123@db:5432/fitnessbros
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
