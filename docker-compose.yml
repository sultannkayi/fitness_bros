
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fitnessbros
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: strongpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # localde pgAdmin vs. ile bağlanmak istersen

  backend:
    build: ./backend
    command: gunicorn main.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/static
    environment:
      - DEBUG=0
      - DATABASE_URL=postgres://fitness:strongpassword123@db:5432/fitnessbros
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - static_volume:/usr/share/nginx/html/static
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf  # ← EKLE

volumes:
  postgres_data:
  static_volume: