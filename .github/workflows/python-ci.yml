name: Django CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # =========================
      # BACKEND (DJANGO)
      # =========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov mutmut

      - name: Run Django migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: main.settings
        run: |
          python manage.py migrate --noinput

      - name: Run tests with pytest + coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: main.settings
        run: |
          pytest -q --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Run mutation tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: main.settings
        run: |
          mutmut run --paths-to-mutate=memberships/services.py,reservations/services.py
          mutmut results
        continue-on-error: true

      # =========================
      # FRONTEND (REACT)
      # =========================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      # =========================
      # FAILURE MAIL
      # =========================

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI Pipeline Failed - ${{ github.repository }}"
          to: sultankayi01@gmail.com,mmertkaplan01@gmail.com,akinmenge8552@gmail.com
          from: GitHub Actions
          body: |
            Pipeline failed!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Workflow: ${{ github.workflow }}

            Check details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
